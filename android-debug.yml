name: Build Paw & Hand APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Paw & Hand ZIP
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            ls -la
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          PACKAGE_FILE=$(find extracted -name package.json -not -path "*/node_modules/*" -print -quit)

          if [ -z "$PACKAGE_FILE" ]; then
            echo "ERROR: package.json not found inside ZIP"
            find extracted -maxdepth 4 -type f | sort | head -n 150
            exit 1
          fi

          APP_DIR=$(cd "$(dirname "$PACKAGE_FILE")" && pwd)

          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

          echo "Paw & Hand found at:"
          echo "$APP_DIR"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: |
          cd "$APP_DIR"
          npm install --no-audit --no-fund

      - name: Build Paw & Hand
        run: |
          cd "$APP_DIR"
          npm run build

      - name: Create Android project
        run: |
          cd "$APP_DIR"

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

      - name: Build Android APK
        run: |
          cd "$APP_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APP_DIR/android/app/build/outputs/apk/debug/app-debug.apk" "$GITHUB_WORKSPACE/output/Paw-and-Hand.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Paw-and-Hand-Android
          path: output/Paw-and-Hand.apk
          if-no-files-found: error
