name: Build Paw & Hand APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract Paw & Hand project
        shell: bash
        run: |
          echo "Files in repository:"
          find . -maxdepth 2 -type f | sort

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Paw & Hand ZIP file was not found"
            exit 1
          fi

          echo "Using ZIP:"
          echo "$ZIP_FILE"

          mkdir -p extracted-app
          unzip -q "$ZIP_FILE" -d extracted-app

          echo "Extracted files:"
          find extracted-app -maxdepth 4 -type f | sort | head -n 200

          PACKAGE_FILE=$(find extracted-app \
            -type f \
            -name package.json \
            -not -path "*/node_modules/*" \
            | head -n 1)

          if [ -z "$PACKAGE_FILE" ]; then
            echo "ERROR: package.json was not found inside ZIP"
            exit 1
          fi

          APP_DIR=$(cd "$(dirname "$PACKAGE_FILE")" && pwd)

          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

          echo "Paw & Hand project found:"
          echo "$APP_DIR"

          ls -la "$APP_DIR"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Check project
        shell: bash
        run: |
          cd "$APP_DIR"

          echo "Working directory:"
          pwd

          echo "package.json:"
          cat package.json

          npm --version
          node --version

      - name: Install dependencies
        shell: bash
        run: |
          cd "$APP_DIR"

          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Build Paw & Hand web app
        shell: bash
        run: |
          cd "$APP_DIR"
          npm run build

      - name: Create Android project
        shell: bash
        run: |
          cd "$APP_DIR"

          if [ ! -d android ]; then
            echo "Creating Android Capacitor project..."
            npx cap add android
          fi

          npx cap sync android

      - name: Build Android APK
        shell: bash
        run: |
          cd "$APP_DIR/android"

          chmod +x gradlew

          ./gradlew assembleDebug --no-daemon

      - name: Find and prepare APK
        shell: bash
        run: |
          APK_FILE=$(find "$APP_DIR/android/app/build/outputs/apk" \
            -type f \
            -name "*debug*.apk" \
            | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not created"
            find "$APP_DIR/android/app/build/outputs" -type f || true
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/build-output"

          cp "$APK_FILE" \
            "$GITHUB_WORKSPACE/build-output/Paw-and-Hand.apk"

          echo "APK CREATED:"
          ls -lh "$GITHUB_WORKSPACE/build-output/Paw-and-Hand.apk"

      - name: Upload Paw & Hand APK
        uses: actions/upload-artifact@v6
        with:
          name: Paw-and-Hand-Android
          path: build-output/Paw-and-Hand.apk
          if-no-files-found: error
