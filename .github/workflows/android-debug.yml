name: Build Paw & Hand APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  android-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract Paw & Hand V10
        run: ZIP_FILE=$(find . -type f -iname "*v10*.zip" | head -n 1)

echo "Found V10 ZIP: $ZIP_FILE"

if [ -z "$ZIP_FILE" ]; then
  echo "ERROR: No V10 ZIP found anywhere in repository"
  echo "Files currently in repository:"
  find . -maxdepth 4 -type f | sort
  exit 1
fi
          

          
            
            


          rm -rf build-src
          mkdir build-src
          unzip -q "$ZIP_FILE" -d build-src

          PACKAGE_FILE=$(find build-src -name package.json -not -path "*/node_modules/*" | head -n 1)

          if [ -z "$PACKAGE_FILE" ]; then
            echo "ERROR: package.json not found inside V10 ZIP"
            exit 1
          fi

          APP_DIR=$(dirname "$PACKAGE_FILE")

          echo "Building Paw & Hand from: $APP_DIR"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

          ls -la "$APP_DIR"
          ls -la "$APP_DIR/src"

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm install --no-audit --no-fund

      - name: Build web app
        working-directory: ${{ env.APP_DIR }}
        run: npm run build

      - name: Create Android project
        working-directory: ${{ env.APP_DIR }}
        run: npx cap add android

      - name: Sync Android
        working-directory: ${{ env.APP_DIR }}
        run: npx cap sync android

      - name: Build debug APK
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Paw-and-Hand-V10-Android
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
